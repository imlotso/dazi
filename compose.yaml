services:
  app:
    build: .
    restart: unless-stopped
    environment:
      CODE_SECRET: ${CODE_SECRET:?请在 .env 中配置至少 32 位的 CODE_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - typing_data:/app/data
    expose:
      - "3001"
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?请在 .env 中配置站点域名}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  typing_data:
  caddy_data:
  caddy_config:
